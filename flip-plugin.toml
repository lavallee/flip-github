[plugin]
id = "lavallee/github-evidence"
version = "0.3.0"
summary = "Keep GitHub issue, pull-request, and discussion evidence current through complete API captures."
license = "MIT"
requires_flip = ">=0.22"
capabilities = ["definitions"]

[exports]
workflows = ["workflows/github-source-refresh.toml"]
